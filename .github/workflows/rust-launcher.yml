name: Rust launcher

on:
  push:
    paths:
      - 'launcher-rust/**'
      - '.github/workflows/rust-launcher.yml'
  pull_request:
    paths:
      - 'launcher-rust/**'
      - '.github/workflows/rust-launcher.yml'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - run: cargo test
        continue-on-error: true
      - name: Commit snapshots
        if: always() && runner.os == 'Windows'
        shell: bash
        working-directory: .
        run: |
          git config user.name snapshots
          git config user.email snapshots@example.invalid
          git add launcher-rust/snapshots
          git commit -m "snapshots: graphics page made on Windows" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: spartanport-launcher-${{ matrix.os }}
          path: launcher-rust/target/release/spartanport-launcher*
